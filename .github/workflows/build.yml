# Automatically build the project for every push and submitted pull request,
# across all supported Minecraft versions. This catches issues early and
# provides a first line of defence against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.3']
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Pmc=${{ matrix.mc }}
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-${{ matrix.mc }}
          path: build/libs/
