plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Welche Minecraft-Version gebaut wird: ./gradlew build -Pmc=26.3
// Ohne -Pmc wird die Standardversion gebaut. Je Version die passende
// Fabric-API und der Bereich fuer fabric.mod.json; der versionsabhaengige
// Quellcode liegt unter src/compat-<mc>/java (siehe unten).
def defaultMc = '26.2'
def mc = (project.findProperty('mc') ?: defaultMc).toString()
def mcVersions = [
	'26.2': [minecraft: '26.2', fabricApi: '0.159.0+26.2', range: '~26.2'],
	'26.3': [minecraft: '26.3', fabricApi: '0.162.0+26.3', range: '~26.3'],
]
def sel = mcVersions[mc]
if (sel == null) {
	throw new GradleException("Unbekanntes -Pmc=${mc}. Unterstuetzt: ${mcVersions.keySet().join(', ')}")
}
// Mod-Version traegt die Ziel-MC-Version, damit sich die Jars nicht ueberschreiben.
version = "${project.version}+${mc}"

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"terrafill" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Der einzige API-Unterschied zwischen den Versionen (LivingEntity.swing) steckt
// in einer Compat-Klasse; je Ziel-MC-Version wird genau ein Ordner dazugenommen.
// Echter Quellcode (nicht Reflection), damit Loom die Methoden korrekt auf
// Intermediary remappt.
sourceSets.client.java.srcDir "src/compat-${mc}/java"

dependencies {
	// Minecraft- und Fabric-API-Version kommen aus der mcVersions-Tabelle oben
	// (gesteuert ueber -Pmc); der Loader steht in gradle.properties.
	minecraft "com.mojang:minecraft:${sel.minecraft}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${sel.fabricApi}"
}

processResources {
	def version = project.version
	def minecraftRange = sel.range
	inputs.property "version", version
	inputs.property "minecraftRange", minecraftRange

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_range": minecraftRange
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
